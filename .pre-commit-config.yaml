# Shared pre-commit hooks for the humanoids_ws superproject.
#
# Install (done automatically by .devcontainer/post_create.sh):
#   pip install --user pre-commit
#   git config --global core.hooksPath "$PWD/.githooks"
#
# core.hooksPath is global, so this fires for the root repo AND every nested
# repo under src/ on `git commit` -- including files written by an agent that
# were never opened in VS Code.
#
# Style limits deliberately match the ROS 2 ament lint checks run by CI:
#   Python : ament_flake8 max-line-length = 99  -> ruff line-length = 99
#   C++    : ament_cpplint --linelength = 100   -> clang-format ColumnLimit = 100
---
# Keep third-party / vendored trees and non-code dirs untouched.
exclude: ^(src/dependencies|refs|docs)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        args: [--style=file]
        # The hook's default types_or includes `json`, but our .clang-format is
        # Language: Cpp and clang-format cannot apply a Cpp config to JSON
        # (e.g. .vscode/*.json). Restrict it to C-family sources only.
        types_or: [c, c++, cuda]
